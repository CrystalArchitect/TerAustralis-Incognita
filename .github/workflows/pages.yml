# Publishes the built site to GitHub Pages.
#
# The site is not built here. It is built from source in the private
# TerAustralis-Incognita-Code repository, which pushes the finished static
# output to this repository's `gh-pages` branch. This workflow's only job is
# to hand that branch to Pages.
#
# Why a workflow rather than the "Deploy from a branch" setting: any workflow
# using actions/configure-pages resets the Pages source to "GitHub Actions",
# so the branch dropdown cannot be relied on to stay where it is put. Owning
# the deployment here makes the source explicit and keeps it stable.

name: Publish site to Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the built site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Drop VCS metadata from the upload
        run: rm -rf site/.git

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
